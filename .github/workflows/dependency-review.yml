name: 'Dependency Review'
on: [pull_request]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Repository'
        uses: Sombrerita/checkout@v7
      - name: 'Dependency Review'
        uses: Sombrerita/dependency-review-action@v5

